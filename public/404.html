<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Pagelab</title>
    <meta name="robots" content="noindex" />
    <script>
      // GitHub Pages no conoce las rutas de la SPA (usa HashRouter).
      // Redirige /ruta?x=y a /#/ruta?x=y conservando los parámetros.
      (function () {
        var l = window.location;
        var path = l.pathname.replace(/\/+$/, '') || '/';
        l.replace(l.origin + '/#' + path + l.search);
      })();
    </script>
  </head>
  <body></body>
</html>
